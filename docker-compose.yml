# 片坞 Movie Dock — 飞牛 fnOS Docker Compose
#
# 快速开始：
#   git clone https://github.com/<用户名>/fn-movie-dock.git
#   cd fn-movie-dock
#   # 修改下方 volumes 为你的飞牛路径
#   docker compose up -d --build
#   浏览器打开 http://NAS-IP:8090
#
# 详细说明见 README.md

services:
  movie-dock:
    build: .
    image: movie-dock:0.1.1
    container_name: movie-dock
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # 一般请在网页「设置」里配置大模型，不要在这里写 Key
      # （环境变量优先级高于 /config/config.yaml）
      DOWNLOAD_ROOT: /downloads
      ARIA2_RPC_URL: http://127.0.0.1:6800/jsonrpc
      SERVER_PORT: "8090"
      # MAX_CONCURRENT: "3"
      # ARIA2_RPC_SECRET: ""
    volumes:
      # === 请按你的飞牛共享目录修改 ===
      - /vol1/apps/fn-movie-dock/config:/config
      - /vol1/media:/downloads
      - /vol1/apps/fn-movie-dock/data:/data
