name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装系统工具（aria2 / 7z / libarchive）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 p7zip-full libarchive-tools

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q app scripts

      - name: 前端 JS 语法检查
        run: node --check app/static/app.js

      - name: 核心单测（原版回归）
        run: python scripts/review_checks.py

      - name: 核心单测（新增功能）
        run: python scripts/unit_checks.py

      - name: 桌面/跨平台层自检
        run: python scripts/desktop_checks.py

      - name: 端到端下载链路（aria2 → 整理）
        run: python scripts/ci_download_test.py --port 8095 --aria2-port 6802 --size-mb 4

      - name: 桌面启动器自检（headless）
        run: |
          python -m app.desktop --selftest --port 8098 \
            --config "$RUNNER_TEMP/md-config/config.yaml" \
            --download-dir "$RUNNER_TEMP/md-dl"
