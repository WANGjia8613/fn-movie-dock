name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-win64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 中文输出在 Windows 控制台会撞 cp936/cp1252，统一 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt pyinstaller

      - name: 拉取随包二进制（aria2c.exe / 7z.exe+7z.dll）
        shell: bash
        run: python scripts/fetch_vendor.py --platform win64

      - name: 语法检查
        shell: bash
        run: python -m compileall -q app scripts

      - name: 单测（Windows 上跑）
        shell: bash
        run: |
          python scripts/review_checks.py
          python scripts/unit_checks.py
          python scripts/desktop_checks.py

      - name: 环境自检（源码模式）
        shell: bash
        run: |
          python -m app.desktop --selftest --port 8098 \
            --config "$RUNNER_TEMP/md-config/config.yaml" \
            --download-dir "$RUNNER_TEMP/md-dl"

      - name: 端到端下载链路（aria2c.exe → 整理）
        shell: bash
        run: python scripts/ci_download_test.py --port 8095 --aria2-port 6802 --size-mb 4

      - name: PyInstaller 打包
        shell: bash
        run: pyinstaller packaging/moviedock.spec --noconfirm

      - name: 打包产物自检（MovieDockCLI.exe --selftest）
        shell: bash
        run: |
          ls -la dist/MovieDock | head -20
          ./dist/MovieDock/MovieDockCLI.exe --selftest --port 8097 \
            --config "$RUNNER_TEMP/md-exe-config/config.yaml" \
            --download-dir "$RUNNER_TEMP/md-exe-dl"

      - name: 打包体积与内容
        shell: bash
        run: du -sh dist/MovieDock && ls dist/MovieDock/vendor/win64 || true

      - name: 压缩 + 校验和
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MovieDock/* -DestinationPath MovieDock-win64.zip -Force
          $hash = (Get-FileHash MovieDock-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MovieDock-win64.zip" | Set-Content -Encoding ASCII SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "{0:N1} MB" -f ((Get-Item MovieDock-win64.zip).Length / 1MB)

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MovieDock-win64
          path: |
            MovieDock-win64.zip
            SHA256SUMS.txt
          retention-days: 30

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Movie Dock ${{ github.ref_name }}（Windows 版）
          body: |
            片坞 Movie Dock —— Windows 本地版（搜索 / 下载 / 自动整理 / 自动中文字幕）。

            **下载 `MovieDock-win64.zip`，解压后双击 `MovieDock.exe`。**

            - `MovieDock.exe`：主程序（WebView2 窗口）
            - `MovieDockCLI.exe`：控制台版，排查问题用（`--selftest` / `--headless`）
            - 首次启动会生成配置：`%APPDATA%\MovieDock\config.yaml`
            - 随包已带 `aria2c.exe` 与 `7z.exe/7z.dll`，无需另装
            - 未做代码签名，SmartScreen 可能提示，选择「仍要运行」即可
          files: |
            MovieDock-win64.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
