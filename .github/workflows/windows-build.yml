name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-win64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 中文输出在 Windows 控制台会撞 cp936/cp1252，统一 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt pyinstaller

      - name: 拉取随包二进制（aria2c.exe / 7z.exe+7z.dll）
        shell: bash
        run: python scripts/fetch_vendor.py --platform win64

      - name: 语法检查
        shell: bash
        run: python -m compileall -q app scripts

      - name: 单测（Windows 上跑）
        shell: bash
        run: |
          python scripts/review_checks.py
          python scripts/unit_checks.py
          python scripts/desktop_checks.py

      - name: 环境自检（源码模式）
        shell: bash
        run: |
          python -m app.desktop --selftest --port 8098 \
            --config "$RUNNER_TEMP/md-config/config.yaml" \
            --download-dir "$RUNNER_TEMP/md-dl"

      - name: 端到端下载链路（aria2c.exe → 整理）
        shell: bash
        run: python scripts/ci_download_test.py --port 8095 --aria2-port 6802 --size-mb 4

      - name: 任务操作链路（暂停/继续/删除历史）
        shell: bash
        run: python scripts/ci_ops_test.py --port 8087 --aria2-port 6807 --size-mb 12

      - name: PyInstaller 打包
        shell: bash
        run: pyinstaller packaging/moviedock.spec --noconfirm

      - name: 代码签名（自签名证书；未配 secret 则跳过）
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_CSC_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.WIN_CSC_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host "未配置 WIN_CSC_PFX_B64，跳过代码签名"
            exit 0
          }
          [IO.File]::WriteAllBytes("$PWD\codesign.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Write-Host "signtool: $signtool"
          foreach ($f in @("dist\MovieDock\MovieDock.exe", "dist\MovieDock\MovieDockCLI.exe")) {
            Write-Host "签名 $f"
            & $signtool sign /f codesign.pfx /p $env:PFX_PASSWORD /fd SHA256 `
                /tr http://timestamp.digicert.com /td SHA256 /v "$f"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "带时间戳签名失败（网络？），改为不带时间戳重试" -ForegroundColor Yellow
              & $signtool sign /f codesign.pfx /p $env:PFX_PASSWORD /fd SHA256 /v "$f"
              if ($LASTEXITCODE -ne 0) { throw "签名失败：$f" }
            }
          }
          Remove-Item "$PWD\codesign.pfx" -Force

      - name: 验证签名（指纹必须与 secret 一致）
        shell: pwsh
        env:
          EXPECTED: ${{ secrets.WIN_CSC_THUMBPRINT }}
        run: |
          if (-not $env:EXPECTED) {
            Write-Host "未配置 WIN_CSC_THUMBPRINT，跳过校验"
            exit 0
          }
          foreach ($f in @("dist/MovieDock/MovieDock.exe", "dist/MovieDock/MovieDockCLI.exe")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f  Status=$($sig.Status)  Thumbprint=$($sig.SignerCertificate.Thumbprint)"
            if (-not $sig.SignerCertificate) { throw "签名缺失：$f" }
            if ($sig.SignerCertificate.Thumbprint -ne $env:EXPECTED) { throw "指纹不匹配：$f" }
          }
          Write-Host "两个 exe 签名均已校验通过" -ForegroundColor Green

      - name: 打包产物自检（MovieDockCLI.exe --selftest）
        shell: bash
        run: |
          ls -la dist/MovieDock | head -20
          ./dist/MovieDock/MovieDockCLI.exe --selftest --port 8097 \
            --config "$RUNNER_TEMP/md-exe-config/config.yaml" \
            --download-dir "$RUNNER_TEMP/md-exe-dl"

      - name: 打包体积与内容
        shell: bash
        run: du -sh dist/MovieDock && ls dist/MovieDock/vendor/win64 || true

      - name: 压缩 + 校验和
        shell: pwsh
        run: |
          # 许可证与声明一起放进包里（MIT + 第三方二进制声明）
          foreach ($f in @("LICENSE", "THIRD-PARTY-NOTICES.md", "README.md", "CHANGES.md")) {
            if (Test-Path $f) { Copy-Item $f dist/MovieDock/ -Force }
          }
          if (Test-Path vendor/win64/License.txt) { Copy-Item vendor/win64/License.txt dist/MovieDock/7-Zip-License.txt -Force }
          if (Test-Path vendor/win64/aria2-COPYING.txt) { Copy-Item vendor/win64/aria2-COPYING.txt dist/MovieDock/aria2-COPYING.txt -Force }
          # 把自签名证书与信任脚本一起放进包里，方便用户本机导入信任
          if (Test-Path packaging/selfsigned/moviedock-codesign.cer) {
            Copy-Item packaging/selfsigned/moviedock-codesign.cer dist/MovieDock/ -Force
          }
          if (Test-Path packaging/trust-moviedock-cert.ps1) {
            Copy-Item packaging/trust-moviedock-cert.ps1 dist/MovieDock/ -Force
          }
          Get-ChildItem dist/MovieDock -Filter *.md | Select-Object Name, Length
          Compress-Archive -Path dist/MovieDock/* -DestinationPath MovieDock-win64.zip -Force
          $hash = (Get-FileHash MovieDock-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MovieDock-win64.zip" | Set-Content -Encoding ASCII SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "{0:N1} MB" -f ((Get-Item MovieDock-win64.zip).Length / 1MB)

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MovieDock-win64
          path: |
            MovieDock-win64.zip
            SHA256SUMS.txt
          retention-days: 30

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Movie Dock ${{ github.ref_name }}（Windows 版）
          body: |
            片坞 Movie Dock —— Windows 本地版（搜索 / 下载 / 自动整理 / 自动中文字幕）。

            **下载 `MovieDock-win64.zip`，解压后双击 `MovieDock.exe`。**

            - `MovieDock.exe`：主程序（WebView2 窗口）
            - `MovieDockCLI.exe`：控制台版，排查问题用（`--selftest` / `--headless`）
            - 首次启动会生成配置：`%APPDATA%\MovieDock\config.yaml`
            - 随包已带 `aria2c.exe` 与 `7z.exe/7z.dll`，无需另装
            - 许可证：本项目为 **MIT**；随包第三方二进制（aria2c=GPL-2.0+，7-Zip=LGPL+unRAR 限制）
              各自适用原许可证，详见包内 `LICENSE`、`THIRD-PARTY-NOTICES.md` 与两份许可证原文

            **关于签名（自签名证书，非商业 CA）**
            - 两个 exe 都已用项目自签名证书签名（SHA256 + 时间戳），SHA1 指纹 `92A2 0205 A8 4C 86 75 86 BD 8E 16 71 D7 B2 B9 A3 1D 2B CC`
            - 想彻底去掉“未知发布者 / SmartScreen”提示：**右键 `trust-moviedock-cert.ps1` → 使用 PowerShell 运行**（会请求管理员权限，把 `moviedock-codesign.cer` 导入本机受信任根/发布者）
            - 不想导入证书也没关系：点“更多信息 → 仍要运行”即可
            - 说明：自签名证书能让 Windows 认可签名有效，但 **SmartScreen 的下载信誉**提示需要商业证书（OV/EV）或 Azure Trusted Signing 才能完全消除
          files: |
            MovieDock-win64.zip
            SHA256SUMS.txt
            packaging/selfsigned/moviedock-codesign.cer
          draft: false
          prerelease: false
